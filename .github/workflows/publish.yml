name: Publish

# 发布流水线。私有仓编译完成后，把成品放进草稿 Release（外部不可见）并触发本工作流；
# 本工作流组装后发布到 npm（可信发布，无令牌，自动带来源证明），同步说明和 skills，
# 再发布 GitHub Release。公开仓只有打包和发布，不接触源码；Actions 在公开仓免费。
#
# npm 上绑定了「本仓库 + publish.yml + npm-publish environment」，改名要同步改 npm。
# 失败后在 Actions 页面重跑：已发布的包核对内容后跳过，已同步的内容不会重复提交。
# 正本在私有仓 ttpos-cli/public/.github/，改完要手动同步到本仓库。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，如 1.2.3"
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: npm-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 校验版本号
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$VERSION"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # 不设 registry-url：它会写入令牌占位配置，干扰 OIDC。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: 安装支持可信发布的 npm
        run: npm install -g npm@11.21.2
      - name: 取私有仓交接的成品
        run: |
          W=$RUNNER_TEMP/handoff
          mkdir -p "$W"
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -p "handoff-$VERSION.tgz" -D "$W"
          tar -xzf "$W/handoff-$VERSION.tgz" -C "$W"
          test -d "$W/npm/cli"
          test -f "$W/bundle/README.md"
          test -f "$W/bundle/install.sh"
          test -d "$W/bundle/skills"
      - name: 发布平台包并核对
        working-directory: ${{ runner.temp }}/handoff
        run: |
          sh "$GITHUB_WORKSPACE/.github/scripts/publish.sh" "$VERSION" npm/cli-*
          sh "$GITHUB_WORKSPACE/.github/scripts/verify-published.sh" "$VERSION" npm/cli-*
      # 平台包全部核对通过才发入口包：入口包一发，latest 就指向新版本。
      - name: 发布入口包并核对
        working-directory: ${{ runner.temp }}/handoff
        run: |
          sh "$GITHUB_WORKSPACE/.github/scripts/publish.sh" "$VERSION" npm/cli
          sh "$GITHUB_WORKSPACE/.github/scripts/verify-published.sh" "$VERSION" npm/cli
      - name: 同步 README、安装脚本和 skills
        run: |
          # 重跑时 checkout 的是当初的提交，先追上 main，否则推送会被拒。
          git fetch -q origin main
          git reset -q --hard FETCH_HEAD
          B=$RUNNER_TEMP/handoff/bundle
          cp "$B/README.md" README.md
          cp "$B/install.sh" install.sh
          chmod +x install.sh
          rm -rf skills
          cp -r "$B/skills" skills
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md install.sh skills
          git diff --cached --quiet || git commit -q -m "release v$VERSION"
          git push -q origin HEAD:main
      - name: 打安装包并发布 Release
        run: |
          D=$RUNNER_TEMP/dist
          W=$RUNNER_TEMP/handoff/npm
          mkdir -p "$D"
          cd "$D"
          for pair in linux:x64:amd64 linux:arm64:arm64 darwin:x64:amd64 darwin:arm64:arm64; do
            os=${pair%%:*}; rest=${pair#*:}; narch=${rest%%:*}; goarch=${rest#*:}
            rm -f ttpos
            cp "$W/cli-$os-$narch/bin/ttpos" ./ttpos
            chmod 755 ./ttpos
            tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' -cf - ttpos | gzip -n > "ttpos_${VERSION}_${os}_${goarch}.tar.gz"
          done
          rm -f ttpos
          sha256sum ./*.tar.gz | sed 's# \./# #' > SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          SHA=$(git rev-parse HEAD)
          gh release upload "v$VERSION" -R "$GITHUB_REPOSITORY" --clobber "$D"/*
          gh release delete-asset "v$VERSION" "handoff-$VERSION.tgz" -R "$GITHUB_REPOSITORY" --yes || true
          gh release edit "v$VERSION" -R "$GITHUB_REPOSITORY" --draft=false --latest --target "$SHA" --title "v$VERSION" \
            --notes "安装：\`npm install -g @ttpos/cli\`，或见 README 的安装脚本。"

  # 单独 job、只读权限：验收要运行下载来的程序，不让它碰写权限和发布身份。
  verify:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: 验收：npm 和安装脚本都装到新版本
        run: |
          T=$(mktemp -d)
          npm install -g "@ttpos/cli@$VERSION" --prefix "$T/npm" --cache "$T/cache" --prefer-online --no-audit --no-fund
          [ "$("$T/npm/bin/ttpos" version)" = "$VERSION" ]
          echo "✓ npm 装到 $VERSION"
          for i in $(seq 1 20); do
            H=$(mktemp -d)
            curl -fsSL https://raw.githubusercontent.com/ZonEaseTech/ttpos-cli/main/install.sh | HOME="$H" TTPOS_INSTALL_DIR="$H/bin" sh >/dev/null 2>&1 || true
            if [ -x "$H/bin/ttpos" ] && [ "$("$H/bin/ttpos" version)" = "$VERSION" ]; then echo "✓ 安装脚本装到 $VERSION"; exit 0; fi
            sleep 30
          done
          echo "::error::安装脚本没有装到 $VERSION"
          exit 1
