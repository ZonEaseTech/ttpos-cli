name: Sync release from npm

# 公开仓不接收任何外部凭据：定时检查 npm，发现新版本就把 README、install.sh、skills
# 同步过来，再用 npm 上的平台包打安装包并建 Release。npm 和安装脚本因此总是同一份
# 二进制。正本在私有仓的 ttpos-cli/public/.github/workflows/，改完要手动同步到公开仓。
#
# 公开仓 60 天没有活动时 GitHub 会停用定时任务；此时运行
# gh workflow enable sync-release.yml -R ZonEaseTech/ttpos-cli
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 查 npm 最新版本
        id: check
        run: |
          set -eu
          VERSION=$(npm view @ttpos/cli dist-tags.latest)
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          n=$(gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          if [ "$n" = "5" ]; then echo "needed=false" >> "$GITHUB_OUTPUT"; echo "v$VERSION 已同步"; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.check.outputs.needed == 'true'

      - name: 同步说明与 skills，打标签
        if: steps.check.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -eu
          W=$(mktemp -d)
          npm pack "@ttpos/cli@$VERSION" --pack-destination "$W" --silent
          tar -xzf "$W"/ttpos-cli-*.tgz -C "$W"
          B="$W/package/bundle"
          test -f "$B/README.md" && test -f "$B/install.sh" && test -d "$B/skills"
          cp "$B/README.md" README.md
          cp "$B/install.sh" install.sh && chmod +x install.sh
          rm -rf skills && cp -r "$B/skills" skills
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md install.sh skills
          git diff --cached --quiet || git commit -q -m "release v$VERSION"
          git push -q origin HEAD:main
          git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null || { git tag "v$VERSION"; git push -q origin "v$VERSION"; }

      - name: 用 npm 上的平台包打安装包
        if: steps.check.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/dist" "$RUNNER_TEMP/work"; cd "$RUNNER_TEMP/work"
          for pair in linux:x64:amd64 linux:arm64:arm64 darwin:x64:amd64 darwin:arm64:arm64; do
            os=${pair%%:*}; rest=${pair#*:}; narch=${rest%%:*}; goarch=${rest#*:}
            # 入口包可见时平台包也已发布，但 CDN 可能晚几分钟
            for i in $(seq 1 40); do
              npm pack "@ttpos/cli-$os-$narch@$VERSION" --silent >/dev/null 2>&1 && break
              [ "$i" -lt 40 ] || { echo "取不到 @ttpos/cli-$os-$narch@$VERSION" >&2; exit 1; }
              sleep 15
            done
            rm -rf x && mkdir x && tar -xzf "ttpos-cli-$os-$narch-$VERSION.tgz" -C x
            cp x/package/bin/ttpos ./ttpos && chmod 755 ./ttpos
            tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' -cf - ttpos | gzip -n > "$RUNNER_TEMP/dist/ttpos_${VERSION}_${os}_${goarch}.tar.gz"
          done
          cd "$RUNNER_TEMP/dist" && sha256sum ./*.tar.gz | sed 's# \./# #' > SHA256SUMS

      - name: 创建 Release（已存在则更新附件）
        if: steps.check.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -eu
          T="v$VERSION"
          if gh release view "$T" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$T" -R "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP"/dist/*
          else
            gh release create "$T" -R "$GITHUB_REPOSITORY" --title "$T" --verify-tag \
              --notes "安装：\`npm install -g @ttpos/cli\`，或见 README 的安装脚本。" "$RUNNER_TEMP"/dist/*
          fi

      - name: 验收：安装脚本装到新版本
        if: steps.check.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -eu
          T=$(mktemp -d)
          HOME="$T" TTPOS_INSTALL_DIR="$T/bin" sh install.sh
          [ "$("$T/bin/ttpos" version)" = "$VERSION" ]
          echo "✓ 安装脚本装到 $VERSION"
